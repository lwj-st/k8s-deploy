apiVersion: v1
data:
  modelengine-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: ModelEngine-Prometheus
        type: prometheus
        uid: gpustack-prometheus
        url: http://modelengine-prometheus.modelstudio.svc:9090
        access: proxy
        isDefault: false
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 15s
kind: ConfigMap
metadata:
  labels:
    app: modelengine-monitoring
    grafana_datasource: "1"
  name: modelengine-grafana-datasource
  namespace: monitoring

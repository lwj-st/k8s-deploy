contactPoints:
  - uid: modelstudio-email
    name: ModelStudio 邮件通知
    type: email
    settings:
      addresses: ops@example.com
      singleEmail: false
    disableResolveMessage: false

notificationPolicy:
  receiver: ModelStudio 邮件通知
  group_by:
    - grafana_folder
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

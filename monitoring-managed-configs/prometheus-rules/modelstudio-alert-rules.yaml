apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: modelstudio-alert-rules
  namespace: monitoring
  labels:
    release: kube-prom-stack
    role: alert-rules
spec:
  groups:
    - name: modelstudio.infrastructure
      rules:
        - alert: CoreServiceReplicasUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace=~"platform|jialing|yangzi-middleware|modelstudio"} > kube_deployment_status_replicas_available{namespace=~"platform|jialing|yangzi-middleware|modelstudio"}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "核心服务副本不可用"
            description: "platform、jialing、yangzi-middleware、modelstudio 命名空间下 Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 可用副本小于期望副本。"

        - alert: MonitoringTargetDown
          expr: up{job!~"kube-proxy|kube-controller-manager|kube-scheduler|kube-etcd"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "监控目标不可抓取"
            description: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} 当前 up=0。已排除 kube-proxy、kube-controller-manager、kube-scheduler、kube-etcd。"

        - alert: ClusterCpuUsageHigh
          expr: |
            100 * sum(rate(container_cpu_usage_seconds_total{container!="",pod!=""}[5m])) / sum(machine_cpu_cores) > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "集群 CPU 使用过高"
            description: "集群容器 CPU 使用量占机器总 CPU 核数比例已连续 5 分钟大于 85%，当前值 {{ $value | printf \"%.2f\" }}%。"

        - alert: ClusterMemoryUsageHigh
          expr: |
            100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "集群内存使用过高"
            description: "集群内存使用率已连续 5 分钟大于 85%，当前值 {{ $value | printf \"%.2f\" }}%。"

        - alert: ModelEngineWorkerOffline
          expr: |
            sum(kube_pod_status_ready{namespace="modelstudio-worker",pod=~"gpustack-worker-.*",condition="true"}) < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ModelEngine Worker 离线"
            description: "modelstudio-worker 命名空间下没有 Ready 的 ModelEngine Worker Pod。"

        - alert: ModelEngineWorkerNotReady
          expr: |
            sum(kube_pod_status_ready{namespace="modelstudio-worker",pod=~"gpustack-worker-.*",condition="false"}) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ModelEngine Worker 不可用"
            description: "modelstudio-worker 命名空间下存在 NotReady 的 ModelEngine Worker Pod。"

    # API 5xx、API P99、模型实例数不足、推理队列积压需要业务侧暴露明确指标后再启用。
    # 推荐后续补充的指标示例：
    # - http_requests_total{namespace, service, route, status}
    # - http_request_duration_seconds_bucket{namespace, service, route, le}
    # - modelengine_model_replicas_expected{model}
    # - modelengine_model_replicas_running{model}
    # - modelengine_inference_queue_waiting_requests{model}

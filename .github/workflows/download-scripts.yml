# 按「脚本 × OS × 架构」拆分 job，便于在 Actions 里按名称过滤日志
# 脚本：k8s / tools / nvidia（均为 *-packages-docker.sh）
name: Test download scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Script/00-Download-k8s-packages-docker.sh'
      - 'Script/00-Download-tools-packages-docker.sh'
      - 'Script/00-Download-nvidia-packages-docker.sh'
      - 'Script/framework.sh'
      - 'config/package-repos/**'
      - 'manifests/artifacts.yaml'
      - '.github/workflows/download-scripts.yml'
  push:
    paths:
      - 'Script/00-Download-k8s-packages-docker.sh'
      - 'Script/00-Download-tools-packages-docker.sh'
      - 'Script/00-Download-nvidia-packages-docker.sh'
      - 'Script/framework.sh'
      - 'config/package-repos/**'
      - 'manifests/artifacts.yaml'
      - '.github/workflows/download-scripts.yml'

jobs:
  download:
    name: "${{ matrix.script }} / ${{ matrix.platform }} / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        script: [k8s, tools, nvidia]
        arch: [amd64, arm64]
        platform:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - centos:7.9.2009
          - centos:8.4.2105
          - rocky:9.2
          - rocky:9.3
          - rocky:10.2
          - openeuler:24.03
          - openeuler:24.03-lts-sp4
          - openeuler:22.03-lts
          - kylin:v10-sp1
          - kylin:v10-sp2
          - kylin:v10-sp3
        include:
          - arch: amd64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
        exclude:
          # CentOS 7/8 官方镜像没有可靠 arm64 变体，ARM 下载测试从仍维护多架构镜像的发行版覆盖。
          - arch: arm64
            platform: centos:7.9.2009
          - arch: arm64
            platform: centos:8.4.2105
    env:
      K8S_VERSION: "1.31.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install package metadata tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Run download and verify
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          os_id="${platform%%:*}"
          os_version="${platform#*:}"
          OUT="${RUNNER_TEMP}/k8s-deploy-dl-${{ matrix.script }}-${os_id}-${os_version}-${arch}"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          case "${{ matrix.script }}" in
            k8s)
              bash Script/00-Download-k8s-packages-docker.sh "$os_id" "$os_version" "$OUT" "$K8S_VERSION" "$arch"
              ;;
            tools)
              bash Script/00-Download-tools-packages-docker.sh "$os_id" "$os_version" "$OUT" "$arch"
              ;;
            nvidia)
              bash Script/00-Download-nvidia-packages-docker.sh "$os_id" "$os_version" "$OUT" "$arch"
              ;;
            *)
              echo "unknown matrix.script"
              exit 1
              ;;
          esac

          if [ "${{ matrix.script }}" = "tools" ]; then
            if [ "$os_id" = "ubuntu" ]; then
              count=$(find "$OUT" -mindepth 2 -maxdepth 2 -name '*.deb' 2>/dev/null | wc -l)
            else
              count=$(find "$OUT" -mindepth 2 -maxdepth 2 -name '*.rpm' 2>/dev/null | wc -l)
            fi
          else
            if [ "$os_id" = "ubuntu" ]; then
              count=$(find "$OUT" -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l)
            else
              count=$(find "$OUT" -maxdepth 1 -name '*.rpm' 2>/dev/null | wc -l)
            fi
          fi

          if [ "${count:-0}" -lt 1 ]; then
            echo "ERROR: 下载后无包 script=${{ matrix.script }} platform=${os_id}-${os_version} dir=$OUT"
            exit 1
          fi

          if [ "$os_id" = "ubuntu" ]; then
            while IFS= read -r deb; do
              arch=$(dpkg-deb -f "$deb" Architecture)
              case "$arch" in "${{ matrix.deb_arch }}"|all) ;; *) echo "ERROR: 非 ${{ matrix.deb_arch }} deb: $deb ($arch)"; exit 1;; esac
            done < <(find "$OUT" -name '*.deb' -type f)
          else
            while IFS= read -r rpm; do
              arch=$(rpm -qp --qf '%{ARCH}' "$rpm")
              case "$arch" in "${{ matrix.rpm_arch }}"|noarch) ;; *) echo "ERROR: 非 ${{ matrix.rpm_arch }} rpm: $rpm ($arch)"; exit 1;; esac
            done < <(find "$OUT" -name '*.rpm' -type f)
          fi

          echo "输出下载目录全部文件 MD5（仅计算，不做比对）..."
          find "$OUT" -type f -exec md5sum {} \;
          echo "OK: ${count} 个包"
          sudo rm -rf "$OUT"

      - name: Cleanup
        if: always()
        run: |
          platform="${{ matrix.platform }}"
          sudo rm -rf "${RUNNER_TEMP}/k8s-deploy-dl-${{ matrix.script }}-${platform%%:*}-${platform#*:}-${{ matrix.arch }}"
